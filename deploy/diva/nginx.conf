# diva.cafe-ai.de — SPA + /api reverse proxy, everything behind basic auth.
server {
    listen 80;
    server_name _;

    auth_basic "DIVA Evaluation";
    auth_basic_user_file /etc/nginx/htpasswd;

    # study-bundle imports are multi-megabyte JSON uploads
    client_max_body_size 200m;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        # the run-progress endpoint streams SSE — no buffering, generous timeout
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# cert-nudge: comment change to force a container recreate (Let's Encrypt retries on container events)
